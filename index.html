<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Audio Instrument</title>

    <link rel="reset" href="reset.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/tone"></script>
    <script src="main.js" defer></script>
</head>
<body>
    <dialog id="intro-modal">
        Make sure to adjust your volume settings before playing the synthesiser!
        <button id="intro-modal-close">Okay, continue!</button>
    </dialog>

    <header>
        <h1>RandomSynth</h1>
    </header>

    <main>
    <h3> Notes </h3>
        <button id="C4" class="whiteKey" data-note="C4">C4</button>
        <button id="D4" class="whiteKey" data-note="D4">D4</button>
        <button id="E4" class="whiteKey" data-note="E4">E4</button>
        <button id="F4" class="whiteKey" data-note="F4">F4</button>
        <button id="G4" class="whiteKey" data-note="G4">G4</button>
        <button id="A4" class="whiteKey" data-note="A4">A4</button>
        <button id="B4" class="whiteKey" data-note="B4">B4</button>

         <!-- random values button -->
        <button id ="random-values" class="whiteKey">Give me something to work with!</button>

    <h3> Volume</h3>
        <div class="slidecontainer"> <!--Slider element = https://www.w3schools.com/howto/howto_js_rangeslider.asp-->
            <input type="range" min="1" max="100" value="50" class="slider" id="myRange">
        </div>

    <h3>Pitch</h3>
        <div class="slidecontainer">
         <input type="range" min="-12" max="12" value="0" class="slider" id="pitchSlider">
        </div>

    <h3>Filter</h3>
        <div class="slidecontainer">
            <input type="range" min="100" max="5000" value="5000" class="slider" id="filterSlider">
        </div>

    </main>
           

</body>
